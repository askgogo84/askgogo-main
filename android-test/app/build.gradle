plugins {
    id 'com.android.application'
}

android {
    namespace 'com.askgogo.test'
    compileSdk 35

    defaultConfig {
        applicationId 'com.askgogo.test'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-test'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

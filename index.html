<body>
<div id="boot"><div><b>Meet Gogo.</b><p>Opening your personal AI…</p></div></div>
<noscript><div style="max-width:46rem;margin:4rem auto;padding:1.5rem"><h1>Meet Gogo.</h1><p>Your personal AI that remembers, plans, acts and keeps working when you're away.</p><p><a href="https://api.whatsapp.com/send?phone=17605483659&amp;text=Hi%20Gogo">Talk to Gogo</a> · <a href="https://app.askgogo.in/dashboard/home">Open dashboard</a></p></div></noscript>
<script>
(async()=>{
  const parts=['/site-final/part-00.htmlfrag','/site-final/stage-01.htmlfrag','/site-final/stage-02.htmlfrag','/site-final/stage-03.htmlfrag','/site-final/stage-04.htmlfrag','/site-final/stage-05.htmlfrag','/site-final/stage-06.htmlfrag','/site-final/stage-07.htmlfrag','/site-final/stage-08.htmlfrag'];
  try{
    const responses=await Promise.all(parts.map(p=>fetch(p,{cache:'no-store'})));
    if(responses.some(r=>!r.ok))throw new Error('final_site_part_missing');
    let html=(await Promise.all(responses.map(r=>r.text()))).join('');
    html=html.replaceAll('Srinivas','Divya').replaceAll('Priya','Divya').replaceAll('priya@','divya@');
    html=html.replace('</head>','<link rel="stylesheet" href="/site-final/mobile-v2.css"></head>');
    document.open();document.write(html);document.close();
  }catch(e){
    console.error('AskGogo final site load failed',e);
    document.getElementById('boot').innerHTML='<div><b>Meet Gogo.</b><p>We are refreshing the site. You can still talk to Gogo or open your dashboard.</p><p><a href="https://api.whatsapp.com/send?phone=17605483659&amp;text=Hi%20Gogo">Talk to Gogo</a> · <a href="https://app.askgogo.in/dashboard/home">Open dashboard</a></p></div>';
  }
})();
</script>

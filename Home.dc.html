<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AskGogo — Your second brain</title>
<body style="margin:0;background:#F5F3EE">
<script>
(async()=>{
  const files=['c00','c01','c02','c03','c04','c05','c06','c07'];
  const loadPako=()=>new Promise((resolve,reject)=>{
    if(window.pako) return resolve();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
    s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
  });
  try{
    const b64=(await Promise.all(files.map(n=>fetch('/claude/'+n+'.txt',{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error(n+' '+r.status); return r.text();
    })))).join('').replace(/\s/g,'');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    let html='';
    if('DecompressionStream' in window){
      try{
        html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      }catch(e){ html=''; }
    }
    if(!html){
      await loadPako();
      html=new TextDecoder().decode(window.pako.ungzip(bytes));
    }
    document.open(); document.write(html); document.close();
  }catch(e){
    console.error('AskGogo Claude loader failed',e);
    document.body.innerHTML='<div style="font:16px/1.5 Arial;padding:32px;color:#0B0908">AskGogo could not load. Please close this tab and reopen askgogo.in.</div>';
  }
})();
</script>

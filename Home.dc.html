<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AskGogo</title>
<body style="margin:0;background:#f3f2ec">
<script>
(async()=>{
  try{
    const f=['c00','c01','c02','c03','c04','c05','c06','c07'];
    const b=(await Promise.all(f.map(n=>fetch('/claude/'+n+'.txt',{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error(n+' '+r.status);
      return r.text();
    })))).join('').replace(/\s/g,'');
    const z=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div style="font:16px Arial;padding:32px">AskGogo is loading. Please refresh once.</div>';
  }
})();
</script>

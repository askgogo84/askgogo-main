<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support-v2.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
@keyframes gBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes gBreathDeep{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes gBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes gLean{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes gOrbit{to{transform:rotate(360deg)}}
@keyframes gGlow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes gMem{0%{transform:translate(28px,-34px) scale(1);opacity:0}15%{opacity:1}70%{transform:translate(2px,4px) scale(.55);opacity:.9}100%{transform:translate(0,8px) scale(.1);opacity:0}}
@keyframes gPulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes gRing{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.35);opacity:0}}
@keyframes gSpark{0%,100%{transform:scale(0);opacity:0}20%,60%{transform:scale(1);opacity:1}}
@keyframes gWave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-14deg)}}
@keyframes gSway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(5deg)}}
</style></helmet>
<div style="display:inline-block;width:{{ px }};height:{{ px }};line-height:0;vertical-align:middle;position:relative">
<svg viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="{{ aria }}" style="overflow:visible;display:block">
  <defs>
    <radialGradient id="gogoBody" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFBF3"></stop><stop offset=".6" stop-color="#F3E7D3"></stop><stop offset="1" stop-color="#E4D3B9"></stop></radialGradient>
    <radialGradient id="gogoCore" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFB06A" stop-opacity=".95"></stop><stop offset=".55" stop-color="#EF7A27" stop-opacity=".55"></stop><stop offset="1" stop-color="#EF7A27" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="gogoHair" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#4A2E20"></stop><stop offset="1" stop-color="#2C1A13"></stop></radialGradient>
  </defs>
  <sc-if value="{{ isBreathing }}" hint-placeholder-val="{{ false }}">
    <circle cx="60" cy="70" r="50" fill="none" stroke="#EF7A27" stroke-opacity=".35" style="transform-box:fill-box;transform-origin:center;animation:gRing 8s ease-out infinite"></circle>
    <circle cx="60" cy="70" r="50" fill="none" stroke="#EF7A27" stroke-opacity=".25" style="transform-box:fill-box;transform-origin:center;animation:gRing 8s ease-out 4s infinite"></circle>
  </sc-if>
  <sc-if value="{{ isSecure }}" hint-placeholder-val="{{ false }}">
    <path d="M60 6 C80 14 96 16 108 18 C108 60 96 92 60 114 C24 92 12 60 12 18 C24 16 40 14 60 6Z" fill="#F6F1E8" fill-opacity="{{ shieldFill }}" stroke="{{ shieldStroke }}" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="6 5" style="transform-box:fill-box;transform-origin:center;animation:gGlow 4s ease-in-out infinite"></path>
  </sc-if>
  <sc-if value="{{ isThinking }}" hint-placeholder-val="{{ false }}">
    <g style="transform-box:fill-box;transform-origin:center;animation:gOrbit 6s linear infinite">
      <circle cx="60" cy="16" r="3.2" fill="#EF7A27"></circle><circle cx="104" cy="60" r="2.4" fill="#EF7A27" fill-opacity=".7"></circle><circle cx="18" cy="72" r="1.8" fill="#EF7A27" fill-opacity=".5"></circle>
    </g>
  </sc-if>
  <g style="transform-box:fill-box;transform-origin:center 90%;animation:{{ bodyAnim }};opacity:{{ bodyOpacity }}">
    <g fill="url(#gogoHair)" stroke="{{ hairStroke }}" stroke-width="1.6">
      <circle cx="24" cy="52" r="9"></circle><circle cx="28" cy="40" r="10.5"></circle><circle cx="38" cy="30" r="11"></circle><circle cx="51" cy="23" r="11.5"></circle><circle cx="66" cy="22" r="12"></circle><circle cx="81" cy="28" r="11"></circle><circle cx="92" cy="39" r="10.5"></circle><circle cx="96" cy="52" r="9"></circle><circle cx="60" cy="32" r="13"></circle><circle cx="44" cy="40" r="10"></circle><circle cx="78" cy="38" r="10"></circle>
    </g>
    <path d="M60 34 C84 34 100 52 101 76 C102 100 84 113 60 113 C36 113 18 100 19 76 C20 52 36 34 60 34Z" fill="url(#gogoBody)" stroke="{{ bodyStroke }}" stroke-width="1.5"></path>
    <circle cx="60" cy="92" r="23" fill="url(#gogoCore)" style="animation:gGlow {{ glowSpeed }} ease-in-out infinite"></circle>
    <circle cx="42" cy="72" r="4.5" fill="#EF7A27" fill-opacity=".18"></circle><circle cx="78" cy="72" r="4.5" fill="#EF7A27" fill-opacity=".18"></circle>
    <sc-if value="{{ eyesClosed }}" hint-placeholder-val="{{ true }}"><path d="M43 63 q5 4 10 0 M67 63 q5 4 10 0" fill="none" stroke="#2C1A13" stroke-width="2.6" stroke-linecap="round"></path></sc-if>
    <sc-if value="{{ eyesOpen }}" hint-placeholder-val="{{ false }}"><circle cx="48" cy="{{ eyeY }}" r="{{ eyeR }}" fill="#2C1A13"></circle><circle cx="72" cy="{{ eyeY }}" r="{{ eyeR }}" fill="#2C1A13"></circle><circle cx="49.2" cy="{{ eyeHiY }}" r="1" fill="#FFFBF3"></circle><circle cx="73.2" cy="{{ eyeHiY }}" r="1" fill="#FFFBF3"></circle></sc-if>
    <sc-if value="{{ eyesHappy }}" hint-placeholder-val="{{ false }}"><path d="M43 65 q5 -5 10 0 M67 65 q5 -5 10 0" fill="none" stroke="#2C1A13" stroke-width="2.6" stroke-linecap="round"></path><path d="M55 74 q5 3 10 0" fill="none" stroke="#2C1A13" stroke-width="2" stroke-linecap="round" stroke-opacity=".7"></path></sc-if>
    <sc-if value="{{ eyesFlat }}" hint-placeholder-val="{{ false }}"><path d="M44 64 h8 M68 64 h8" fill="none" stroke="#2C1A13" stroke-width="2.6" stroke-linecap="round"></path></sc-if>
    <sc-if value="{{ eyesHalf }}" hint-placeholder-val="{{ false }}"><circle cx="48" cy="64" r="3.2" fill="#2C1A13"></circle><circle cx="72" cy="64" r="3.2" fill="#2C1A13"></circle><path d="M43 61 h10 M67 61 h10" stroke="#F3E7D3" stroke-width="3.2" stroke-linecap="round"></path></sc-if>
    <sc-if value="{{ handsRest }}" hint-placeholder-val="{{ false }}"><ellipse cx="30" cy="98" rx="7" ry="5" fill="#F3E7D3" stroke="#E4D3B9" stroke-width="1"></ellipse><ellipse cx="90" cy="98" rx="7" ry="5" fill="#F3E7D3" stroke="#E4D3B9" stroke-width="1"></ellipse></sc-if>
    <sc-if value="{{ handWave }}" hint-placeholder-val="{{ false }}"><ellipse cx="96" cy="72" rx="6" ry="7.5" fill="#F3E7D3" stroke="#E4D3B9" stroke-width="1" style="transform-box:fill-box;transform-origin:bottom center;animation:gWave 1.2s ease-in-out infinite"></ellipse></sc-if>
    <sc-if value="{{ handsCard }}" hint-placeholder-val="{{ false }}">
      <g style="transform-box:fill-box;transform-origin:center;animation:gBob 3s ease-in-out infinite">
        <rect x="38" y="86" width="44" height="28" rx="6" fill="#FFFFFF" stroke="#E4D3B9" stroke-width="1.2"></rect>
        <rect x="44" y="93" width="22" height="3" rx="1.5" fill="#2C1A13" fill-opacity=".75"></rect><rect x="44" y="100" width="14" height="3" rx="1.5" fill="#2C1A13" fill-opacity=".35"></rect>
        <circle cx="73" cy="100" r="5" fill="#EF7A27"></circle><path d="M70.5 100 l2 2 l3.5 -4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
        <ellipse cx="36" cy="100" rx="6.5" ry="5" fill="#F3E7D3" stroke="#E4D3B9" stroke-width="1"></ellipse><ellipse cx="84" cy="100" rx="6.5" ry="5" fill="#F3E7D3" stroke="#E4D3B9" stroke-width="1"></ellipse>
      </g>
    </sc-if>
  </g>
  <sc-if value="{{ isRemembering }}" hint-placeholder-val="{{ false }}">
    <g style="transform-box:fill-box;transform-origin:center;animation:gMem 3.2s cubic-bezier(.4,0,.2,1) infinite"><rect x="48" y="72" width="24" height="14" rx="4" fill="#FFFFFF" stroke="#EF7A27" stroke-width="1.2"></rect><rect x="52" y="77" width="12" height="2.2" rx="1" fill="#EF7A27"></rect><rect x="52" y="81" width="8" height="2.2" rx="1" fill="#2C1A13" fill-opacity=".3"></rect></g>
  </sc-if>
  <sc-if value="{{ isFound }}" hint-placeholder-val="{{ false }}">
    <g style="transform-box:fill-box;transform-origin:center;animation:gSpark 3s ease-in-out infinite"><path d="M98 18 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5Z" fill="#EF7A27"></path></g>
  </sc-if>
  <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
    <circle cx="98" cy="96" r="11" fill="#2FAE6A" stroke="{{ ringStroke }}" stroke-width="3"></circle><path d="M92.5 96 l4 4 l7.5 -8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
  </sc-if>
  <sc-if value="{{ showStatus }}" hint-placeholder-val="{{ false }}">
    <circle cx="98" cy="102" r="7" fill="#2FAE6A" stroke="{{ ringStroke }}" stroke-width="3" style="animation:gPulse {{ statusSpeed }} ease-in-out infinite"></circle>
  </sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;calm&quot;,&quot;options&quot;:[&quot;calm&quot;,&quot;listening&quot;,&quot;thinking&quot;,&quot;remembering&quot;,&quot;acting&quot;,&quot;watching&quot;,&quot;found&quot;,&quot;approval&quot;,&quot;secure&quot;,&quot;done&quot;,&quot;breathing&quot;,&quot;sleeping&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;min&quot;:16,&quot;max&quot;:600,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showStatus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props; const s = p.state ?? 'calm'; const size = p.size ?? 120; const dark = (p.theme ?? 'light') === 'dark';
    const eyes = {calm:'closed', listening:'open', thinking:'up', remembering:'closed', acting:'open', watching:'half', found:'happy', approval:'open', secure:'closed', done:'happy', breathing:'closed', sleeping:'flat'}[s] || 'closed';
    const anim = {calm:'gBreath 5s ease-in-out infinite', listening:'gLean 3s ease-in-out infinite', thinking:'gBreath 4s ease-in-out infinite', remembering:'gBreath 4s ease-in-out infinite', acting:'gBob 1.1s ease-in-out infinite', watching:'none', found:'gBob 2.2s ease-in-out infinite', approval:'gBreath 4s ease-in-out infinite', secure:'gBreath 5s ease-in-out infinite', done:'gBreath 5s ease-in-out infinite', breathing:'gBreathDeep 8s ease-in-out infinite', sleeping:'gSway 7s ease-in-out infinite'}[s] || 'gBreath 5s ease-in-out infinite';
    const active = ['listening','thinking','acting','watching','found','remembering'].includes(s);
    const status = p.status ?? (active || s==='approval');
    return {
      px: size+'px', aria: 'Gogo — '+s,
      isBreathing: s==='breathing', isSecure: s==='secure', isThinking: s==='thinking', isRemembering: s==='remembering', isFound: s==='found', isDone: s==='done',
      eyesClosed: eyes==='closed', eyesOpen: eyes==='open' || eyes==='up', eyesHappy: eyes==='happy', eyesFlat: eyes==='flat', eyesHalf: eyes==='half',
      eyeY: eyes==='up' ? 60 : 64, eyeHiY: eyes==='up' ? 58.8 : 62.8, eyeR: s==='listening' ? 3.8 : 3.3,
      handsRest: s==='breathing' || s==='calm' && (p.hands ?? false), handWave: s==='acting', handsCard: s==='approval',
      bodyAnim: (p.animate ?? true) ? anim : 'none', bodyOpacity: s==='sleeping' ? .82 : 1,
      glowSpeed: s==='remembering' || s==='found' ? '1.6s' : s==='sleeping' ? '9s' : '4s',
      bodyStroke: dark ? 'rgba(255,251,243,.22)' : 'rgba(44,26,19,.08)',
      hairStroke: dark ? 'rgba(255,251,243,.32)' : 'none',
      shieldFill: dark ? .06 : .5, shieldStroke: dark ? '#F6F1E8' : '#2C1A13',
      ringStroke: dark ? '#0E1614' : '#F6F1E8',
      showStatus: !!status && !['done'].includes(s) && (p.showStatus ?? true) && size >= 40, statusSpeed: s==='watching' ? '2.4s' : '1.6s'
    };
  }
}
</script>
</body>
</html>
